services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: autoapply
      POSTGRES_DB: autoapply
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run start"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autoapply:autoapply@postgres:5432/autoapply
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      DESKTOP_DIR: /desktop
    ports: ["3000:3000"]
    volumes:
      - storage:/data/storage
      # Read-only mount of your Desktop so the app can find your master CV.
      - ${HOME}/Desktop:/desktop:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s

  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autoapply:autoapply@postgres:5432/autoapply
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      DESKTOP_DIR: /desktop
    volumes:
      - storage:/data/storage
      - ${HOME}/Desktop:/desktop:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 60s

volumes:
  pgdata:
  redisdata:
  storage:
